[package]
name = "cineforge"
version = "0.1.0"
description = "CineForge OS desktop shell"
authors = ["CineForge"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
