  - id: CF-CTRL-RELEASE-PROVENANCE
    title: Immutable release build/artifact/signing provenance
    owner: docs/design/EXTREME_HARDENING_CONTRACTS.md
    applicability: V1_BEFORE_RELEASE
    maturity: SPECIFIED
    current_slice_required: false

  - id: CF-CTRL-GITHUB-CLAIM
