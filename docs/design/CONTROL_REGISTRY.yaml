  - id: CF-CTRL-HIGH-SECURE-ERASURE
    title: Honest deletion/crypto-erasure/high-security profile
    owner: docs/design/EXTREME_HARDENING_CONTRACTS.md
    applicability: OPTIONAL_HIGH_SECURITY
    maturity: SPECIFIED
    current_slice_required: false

evidence_policy:
  rule: >
    A control does not advance maturity merely because prose exists.
    IMPLEMENTED and above require concrete code/module references and evidence links.
